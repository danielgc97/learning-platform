id: ia-vibecoding-001
type: quiz
statement: "Cuando construyes con ayuda de una IA, ¿qué parte sigue siendo responsabilidad tuya?"
options:
  - "Ninguna: la IA responde por su código"
  - "Solo escribir los nombres de las variables"
  - "Decidir qué construir, revisar lo que genera y comprobar que funciona de forma segura"
  - "Solo pagar la suscripción de la herramienta"
correct: 2
explanation: "La IA acelera la escritura, pero la dirección del producto y la verificación son tuyas. Si algo falla o expone datos de tus usuarios, la responsabilidad es de quien publica el producto."
