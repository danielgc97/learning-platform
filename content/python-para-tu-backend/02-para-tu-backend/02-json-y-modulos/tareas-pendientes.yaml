id: python-json-001
type: python
statement: "Define una función pendientes(texto_json) que reciba un texto JSON con una lista de tareas (cada una con 'id', 'titulo' y 'hecha') y devuelva otro texto JSON que contenga solo las tareas con hecha en false. Recuerda importar json."
starter_code: |
  import json

  def pendientes(texto_json):
      pass
tests: |
  import json
  entrada = '[{"id": 1, "titulo": "Comprar pan", "hecha": false}, {"id": 2, "titulo": "Pagar luz", "hecha": true}, {"id": 3, "titulo": "Llamar", "hecha": false}]'
  assert callable(pendientes), "pendientes debe ser una función"
  salida = pendientes(entrada)
  assert isinstance(salida, str), "Debe devolver un texto JSON (usa json.dumps), no una lista"
  resultado = json.loads(salida)
  assert [t["id"] for t in resultado] == [1, 3], "Se esperaban solo las tareas 1 y 3"
  assert json.loads(pendientes("[]")) == [], "Con una lista vacía se esperaba []"
solution: |
  import json

  def pendientes(texto_json):
      tareas = json.loads(texto_json)
      resultado = []
      for t in tareas:
          if not t["hecha"]:
              resultado.append(t)
      return json.dumps(resultado)
rubric: "El alumno debe convertir el texto con json.loads, filtrar las tareas con hecha falsa recorriendo la lista, y devolver el resultado como texto con json.dumps."
hints:
  - "Empieza convirtiendo el texto en una lista de diccionarios con json.loads."
  - "Filtra con un for y un if: te interesan las tareas donde hecha es False (puedes escribir if not t[\"hecha\"])."
  - "Al final devuelve la lista como texto con json.dumps(...), no la lista directamente."
