id: citas-tablas-001
type: sql
statement: "Las tablas servicios (id, nombre, precio, duracion_min) y clientes (id, nombre, telefono) ya existen. Define la tabla citas con estas columnas, en este orden: id (INTEGER, clave primaria), cliente_id (INTEGER que referencie a clientes), servicio_id (INTEGER que referencie a servicios), dia (VARCHAR, obligatorio), hora (VARCHAR, obligatorio) y estado (VARCHAR, obligatorio). El INSERT y el SELECT final ya están escritos."
starter_code: |
  CREATE OR REPLACE TABLE citas (
    -- id, cliente_id, servicio_id, dia, hora y estado
  );
  INSERT INTO citas VALUES
    (1, 1, 1, '2026-10-26', '09:00', 'pendiente'),
    (2, 2, 2, '2026-10-26', '10:00', 'pendiente');
  SELECT ci.hora, c.nombre AS cliente, s.nombre AS servicio
  FROM citas ci
  JOIN clientes c ON c.id = ci.cliente_id
  JOIN servicios s ON s.id = ci.servicio_id
  ORDER BY ci.id;
setup_sql: |
  CREATE TABLE servicios (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, precio DOUBLE NOT NULL, duracion_min INTEGER NOT NULL);
  CREATE TABLE clientes (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, telefono VARCHAR);
  INSERT INTO servicios VALUES (1, 'Lavado básico', 15.0, 30), (2, 'Lavado completo', 35.0, 60);
  INSERT INTO clientes VALUES (1, 'Ana', '999111222'), (2, 'Luis', '999333444');
expected:
  columns: [hora, cliente, servicio]
  rows:
    - ["09:00", Ana, Lavado básico]
    - ["10:00", Luis, Lavado completo]
solution: |
  CREATE OR REPLACE TABLE citas (
    id INTEGER PRIMARY KEY,
    cliente_id INTEGER REFERENCES clientes(id),
    servicio_id INTEGER REFERENCES servicios(id),
    dia VARCHAR NOT NULL,
    hora VARCHAR NOT NULL,
    estado VARCHAR NOT NULL
  );
  INSERT INTO citas VALUES
    (1, 1, 1, '2026-10-26', '09:00', 'pendiente'),
    (2, 2, 2, '2026-10-26', '10:00', 'pendiente');
  SELECT ci.hora, c.nombre AS cliente, s.nombre AS servicio
  FROM citas ci
  JOIN clientes c ON c.id = ci.cliente_id
  JOIN servicios s ON s.id = ci.servicio_id
  ORDER BY ci.id;
rubric: "El alumno debe declarar las seis columnas en el orden pedido: id INTEGER PRIMARY KEY, cliente_id y servicio_id INTEGER con REFERENCES a clientes(id) y servicios(id), y dia, hora y estado como VARCHAR NOT NULL."
hints:
  - "Cada columna se escribe como: nombre tipo. Sepáralas con comas; la última no lleva coma."
  - "Una clave foránea se escribe con REFERENCES tabla(columna) después del tipo, por ejemplo: cliente_id INTEGER REFERENCES clientes(id)."
  - "dia, hora y estado son VARCHAR y llevan NOT NULL; id lleva PRIMARY KEY."
