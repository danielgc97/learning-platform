id: citas-consultas-002
type: sql
statement: "Muestra los ingresos por servicio: servicio (nombre) e ingresos (suma de los precios de las citas completadas), de mayor a menor ingreso."
starter_code: "SELECT * FROM servicios;"
setup_sql: |
  CREATE TABLE servicios (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, precio DOUBLE NOT NULL, duracion_min INTEGER NOT NULL);
  CREATE TABLE clientes (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, telefono VARCHAR);
  CREATE TABLE citas (id INTEGER PRIMARY KEY, cliente_id INTEGER REFERENCES clientes(id), servicio_id INTEGER REFERENCES servicios(id), dia VARCHAR NOT NULL, hora VARCHAR NOT NULL, estado VARCHAR NOT NULL);
  INSERT INTO servicios VALUES (1, 'Lavado básico', 15.0, 30), (2, 'Lavado completo', 35.0, 60), (3, 'Encerado', 50.0, 90);
  INSERT INTO clientes VALUES (1, 'Ana', '999111222'), (2, 'Luis', '999333444'), (3, 'Marta', '999555666'), (4, 'Pedro', '999777888');
  INSERT INTO citas VALUES
    (1, 1, 1, '2026-10-26', '09:00', 'completada'),
    (2, 2, 2, '2026-10-26', '10:00', 'completada'),
    (3, 3, 3, '2026-10-26', '12:00', 'completada'),
    (4, 1, 2, '2026-10-27', '09:30', 'completada'),
    (5, 4, 1, '2026-10-27', '11:00', 'cancelada'),
    (6, 2, 1, '2026-10-27', '15:00', 'completada'),
    (7, 1, 3, '2026-10-28', '10:00', 'completada'),
    (8, 3, 1, '2026-10-28', '14:00', 'pendiente');
expected:
  columns: [servicio, ingresos]
  rows:
    - [Encerado, 100]
    - [Lavado completo, 70]
    - [Lavado básico, 30]
solution: |
  SELECT s.nombre AS servicio, SUM(s.precio) AS ingresos
  FROM citas ci
  JOIN servicios s ON s.id = ci.servicio_id
  WHERE ci.estado = 'completada'
  GROUP BY s.nombre
  ORDER BY ingresos DESC;
rubric: "El alumno debe unir citas con servicios, filtrar por estado = 'completada', agrupar por servicio, sumar el precio como ingresos y ordenar descendente."
hints:
  - "El precio está en servicios, así que une citas con servicios."
  - "Filtra primero con WHERE ci.estado = 'completada': las pendientes y canceladas no son ingresos."
  - "Agrupa por s.nombre, suma s.precio como ingresos y ordena con ORDER BY ingresos DESC."
