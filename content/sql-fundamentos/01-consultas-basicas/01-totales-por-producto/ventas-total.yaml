id: sql-ventas-001
type: sql
statement: "La tabla ventas tiene las columnas id, producto, cantidad y precio. Muestra cada producto con su total vendido (cantidad * precio) en una columna llamada total, ordenado de mayor a menor."
starter_code: "SELECT * FROM ventas;"
setup_sql: |
  CREATE TABLE ventas (id INTEGER, producto VARCHAR, cantidad INTEGER, precio DOUBLE);
  INSERT INTO ventas VALUES
    (1, 'Laptop', 2, 3200.0),
    (2, 'Mouse', 10, 45.5),
    (3, 'Teclado', 5, 120.0),
    (4, 'Monitor', 3, 850.0);
expected:
  columns: [producto, total]
  rows:
    - [Laptop, 6400]
    - [Monitor, 2550]
    - [Teclado, 600]
    - [Mouse, 455]
rubric: "El alumno debe multiplicar cantidad por precio, nombrar la columna total y ordenar de forma descendente por ese total."
hints:
  - "Puedes hacer cálculos entre columnas dentro del SELECT."
  - "Usa AS para ponerle nombre a la columna calculada."
  - "ORDER BY ordena el resultado; piensa qué palabra invierte el orden."
