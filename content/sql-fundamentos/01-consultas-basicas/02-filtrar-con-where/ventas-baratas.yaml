id: sql-where-001
type: sql
statement: "La tabla ventas tiene las columnas id, producto, cantidad y precio. Muestra el producto y el precio de los productos que cuestan menos de 500, ordenados por precio de menor a mayor."
starter_code: "SELECT * FROM ventas;"
setup_sql: |
  CREATE TABLE ventas (id INTEGER, producto VARCHAR, cantidad INTEGER, precio DOUBLE);
  INSERT INTO ventas VALUES
    (1, 'Laptop', 2, 3200.0),
    (2, 'Mouse', 10, 45.5),
    (3, 'Teclado', 5, 120.0),
    (4, 'Monitor', 3, 850.0);
expected:
  columns: [producto, precio]
  rows:
    - [Mouse, 45.5]
    - [Teclado, 120]
rubric: "El alumno debe seleccionar producto y precio, filtrar con WHERE precio < 500 y ordenar ascendente por precio."
hints:
  - "Primero elige solo las dos columnas que pide el enunciado."
  - "WHERE va después de FROM y antes de ORDER BY."
  - "Por defecto ORDER BY ordena de menor a mayor."
