id: fundamentos-app-002
type: quiz
statement: "En la API de una plataforma, ¿qué hace una petición GET /courses?"
options:
  - "Borra todos los cursos"
  - "Pide la lista de cursos sin modificar nada"
  - "Crea un curso nuevo"
  - "Inicia la sesión del usuario"
correct: 1
explanation: "GET sirve para pedir datos sin cambiarlos. Con /courses le pides al backend la lista de cursos disponibles."
