id: fundamentos-construir-003
type: quiz
statement: "Después de que el asistente modifica tu código, ¿qué conviene hacer antes de guardarlo con un commit?"
options:
  - "Nada: si no aparece un error, está bien"
  - "Revisar los cambios y probar que funciona, incluso con casos raros"
  - "Borrar el historial de Git"
  - "Pedirle que lo repita sin explicar nada"
correct: 1
explanation: "Que no haya un error visible no significa que esté bien. Revisar el diff y probar casos normales y raros evita publicar fallos."
