id: fundamentos-construir-004
type: quiz
statement: "¿Qué es MCP?"
options:
  - "Un lenguaje de programación para páginas web"
  - "Un estándar que permite a las aplicaciones de IA conectarse de forma uniforme a herramientas y fuentes de datos"
  - "Un tipo de base de datos"
  - "Un modelo de lenguaje de una empresa en particular"
correct: 1
explanation: "MCP (Model Context Protocol) es un estándar abierto, como un USB-C para la IA: una forma común de conectar asistentes con herramientas y datos."
