id: tienda-consultas-003
type: sql
statement: "Muestra el total vendido por mes: mes y total (suma de cantidad * precio_unitario de todas las líneas de ese mes), ordenado por mes."
starter_code: "SELECT * FROM ventas;"
setup_sql: |
  CREATE TABLE productos (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, precio DOUBLE NOT NULL, stock INTEGER NOT NULL, stock_minimo INTEGER NOT NULL);
  CREATE TABLE ventas (id INTEGER PRIMARY KEY, mes VARCHAR NOT NULL);
  CREATE TABLE items_venta (id INTEGER PRIMARY KEY, venta_id INTEGER REFERENCES ventas(id), producto_id INTEGER REFERENCES productos(id), cantidad INTEGER NOT NULL, precio_unitario DOUBLE NOT NULL);
  INSERT INTO productos VALUES
    (1, 'Arroz 5kg', 25.0, 40, 10),
    (2, 'Aceite 1L', 9.5, 6, 10),
    (3, 'Azúcar 1kg', 4.2, 12, 12),
    (4, 'Leche', 5.0, 30, 15),
    (5, 'Fideos', 3.5, 3, 8);
  INSERT INTO ventas VALUES (1, '2026-08'), (2, '2026-08'), (3, '2026-09'), (4, '2026-09'), (5, '2026-09');
  INSERT INTO items_venta VALUES
    (1, 1, 1, 2, 25.0),
    (2, 1, 4, 5, 5.0),
    (3, 2, 2, 3, 9.5),
    (4, 3, 1, 1, 25.0),
    (5, 3, 5, 10, 3.5),
    (6, 4, 4, 6, 5.0),
    (7, 4, 2, 2, 9.5),
    (8, 5, 5, 4, 3.5);
expected:
  columns: [mes, total]
  rows:
    - ["2026-08", 103.5]
    - ["2026-09", 123]
solution: |
  SELECT v.mes, SUM(i.cantidad * i.precio_unitario) AS total
  FROM items_venta i
  JOIN ventas v ON v.id = i.venta_id
  GROUP BY v.mes
  ORDER BY v.mes;
rubric: "El alumno debe unir items_venta con ventas, agrupar por mes, sumar cantidad * precio_unitario como total y ordenar por mes."
hints:
  - "El mes está en ventas y las cantidades en items_venta: necesitas un JOIN entre ellas."
  - "Cada fila del resultado es un mes: GROUP BY v.mes."
  - "El total es SUM(i.cantidad * i.precio_unitario). Ordena con ORDER BY v.mes."
