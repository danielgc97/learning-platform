id: tienda-consultas-002
type: sql
statement: "Muestra los 3 productos más vendidos: nombre y unidades (suma de cantidad vendida en items_venta), de mayor a menor."
starter_code: "SELECT * FROM items_venta;"
setup_sql: |
  CREATE TABLE productos (id INTEGER PRIMARY KEY, nombre VARCHAR NOT NULL, precio DOUBLE NOT NULL, stock INTEGER NOT NULL, stock_minimo INTEGER NOT NULL);
  CREATE TABLE ventas (id INTEGER PRIMARY KEY, mes VARCHAR NOT NULL);
  CREATE TABLE items_venta (id INTEGER PRIMARY KEY, venta_id INTEGER REFERENCES ventas(id), producto_id INTEGER REFERENCES productos(id), cantidad INTEGER NOT NULL, precio_unitario DOUBLE NOT NULL);
  INSERT INTO productos VALUES
    (1, 'Arroz 5kg', 25.0, 40, 10),
    (2, 'Aceite 1L', 9.5, 6, 10),
    (3, 'Azúcar 1kg', 4.2, 12, 12),
    (4, 'Leche', 5.0, 30, 15),
    (5, 'Fideos', 3.5, 3, 8);
  INSERT INTO ventas VALUES (1, '2026-08'), (2, '2026-08'), (3, '2026-09'), (4, '2026-09'), (5, '2026-09');
  INSERT INTO items_venta VALUES
    (1, 1, 1, 2, 25.0),
    (2, 1, 4, 5, 5.0),
    (3, 2, 2, 3, 9.5),
    (4, 3, 1, 1, 25.0),
    (5, 3, 5, 10, 3.5),
    (6, 4, 4, 6, 5.0),
    (7, 4, 2, 2, 9.5),
    (8, 5, 5, 4, 3.5);
expected:
  columns: [nombre, unidades]
  rows:
    - [Fideos, 14]
    - [Leche, 11]
    - [Aceite 1L, 5]
solution: |
  SELECT p.nombre, SUM(i.cantidad) AS unidades
  FROM items_venta i
  JOIN productos p ON p.id = i.producto_id
  GROUP BY p.nombre
  ORDER BY unidades DESC
  LIMIT 3;
rubric: "El alumno debe unir items_venta con productos, agrupar por producto, sumar cantidad como unidades, ordenar descendente y limitar a 3."
hints:
  - "Necesitas el nombre del producto, que está en productos: une las dos tablas con JOIN."
  - "Cada fila del resultado es un producto: GROUP BY p.nombre, y SUM(i.cantidad) cuenta las unidades."
  - "Ordena por unidades de mayor a menor y corta con LIMIT 3."
