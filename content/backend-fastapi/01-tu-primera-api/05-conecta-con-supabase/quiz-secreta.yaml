id: api-supabase-001
type: quiz
statement: "¿Dónde debe guardarse la clave secreta de Supabase en tu backend?"
options:
  - "Escrita directamente en main.py"
  - "En un archivo .env ignorado por Git, leída con os.environ"
  - "En el código del frontend, para que sea más rápido"
  - "En un mensaje a la IA para que la recuerde"
correct: 1
explanation: "Los secretos se guardan en variables de entorno (archivo .env que no se sube) y el código solo lee su valor. Así no quedan en el repositorio ni en el navegador."
