id: sql-leftjoin-001
type: sql
statement: "Con las tablas clientes (id, nombre) y pedidos (id, cliente_id, total), muestra el nombre de los clientes que no tienen ningún pedido."
starter_code: "SELECT nombre FROM clientes;"
setup_sql: |
  CREATE TABLE clientes (id INTEGER, nombre VARCHAR);
  CREATE TABLE pedidos (id INTEGER, cliente_id INTEGER, total DOUBLE);
  INSERT INTO clientes VALUES (1, 'Ana'), (2, 'Luis'), (3, 'Marta'), (4, 'Sofía');
  INSERT INTO pedidos VALUES
    (1, 1, 120.0),
    (2, 1, 80.0),
    (3, 2, 200.0),
    (4, 3, 50.0),
    (5, 2, 30.0);
expected:
  columns: [nombre]
  rows:
    - [Sofía]
solution: |
  SELECT c.nombre
  FROM clientes c
  LEFT JOIN pedidos p ON p.cliente_id = c.id
  WHERE p.id IS NULL;
rubric: "El alumno debe usar LEFT JOIN desde clientes hacia pedidos y filtrar con WHERE p.id IS NULL para dejar solo los clientes sin pedidos."
hints:
  - "La tabla que quieres conservar completa (clientes) va en el FROM, y pedidos se une con LEFT JOIN."
  - "Los clientes sin pedidos tienen todas las columnas de pedidos vacías (NULL)."
  - "Filtra con WHERE p.id IS NULL; con NULL no se usa el signo =."
