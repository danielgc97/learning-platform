id: sql-reporte-001
type: sql
statement: "Con las tablas clientes (id, nombre) y pedidos (id, cliente_id, total), muestra para cada cliente que tenga pedidos: nombre, pedidos (cuántos pedidos hizo) y gastado (suma de sus totales). Ordena de mayor a menor gastado."
starter_code: "SELECT * FROM pedidos;"
setup_sql: |
  CREATE TABLE clientes (id INTEGER, nombre VARCHAR);
  CREATE TABLE pedidos (id INTEGER, cliente_id INTEGER, total DOUBLE);
  INSERT INTO clientes VALUES (1, 'Ana'), (2, 'Luis'), (3, 'Marta'), (4, 'Sofía');
  INSERT INTO pedidos VALUES
    (1, 1, 120.0),
    (2, 1, 80.0),
    (3, 2, 200.0),
    (4, 3, 50.0),
    (5, 2, 30.0);
expected:
  columns: [nombre, pedidos, gastado]
  rows:
    - [Luis, 2, 230]
    - [Ana, 2, 200]
    - [Marta, 1, 50]
solution: |
  SELECT c.nombre,
         COUNT(*) AS pedidos,
         SUM(p.total) AS gastado
  FROM pedidos p
  JOIN clientes c ON c.id = p.cliente_id
  GROUP BY c.nombre
  ORDER BY gastado DESC;
rubric: "El alumno debe unir pedidos con clientes, agrupar por cliente, calcular COUNT(*) como pedidos y SUM(p.total) como gastado, y ordenar de mayor a menor gastado."
hints:
  - "Primero une las tablas con JOIN para tener el nombre junto a cada total."
  - "Cada fila del resultado es un cliente: agrupa con GROUP BY c.nombre."
  - "COUNT(*) cuenta los pedidos de cada grupo y SUM(p.total) los suma; ordena con ORDER BY gastado DESC."
