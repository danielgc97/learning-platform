id: sql-join-001
type: sql
statement: "Hay dos tablas: clientes (id, nombre) y pedidos (id, cliente_id, total). Muestra el nombre del cliente y el total de cada pedido, ordenado por el id del pedido."
starter_code: "SELECT * FROM pedidos;"
setup_sql: |
  CREATE TABLE clientes (id INTEGER, nombre VARCHAR);
  CREATE TABLE pedidos (id INTEGER, cliente_id INTEGER, total DOUBLE);
  INSERT INTO clientes VALUES (1, 'Ana'), (2, 'Luis'), (3, 'Marta'), (4, 'Sofía');
  INSERT INTO pedidos VALUES
    (1, 1, 120.0),
    (2, 1, 80.0),
    (3, 2, 200.0),
    (4, 3, 50.0),
    (5, 2, 30.0);
expected:
  columns: [nombre, total]
  rows:
    - [Ana, 120]
    - [Ana, 80]
    - [Luis, 200]
    - [Marta, 50]
    - [Luis, 30]
solution: |
  SELECT c.nombre, p.total
  FROM pedidos p
  JOIN clientes c ON c.id = p.cliente_id
  ORDER BY p.id;
rubric: "El alumno debe unir pedidos con clientes mediante ON c.id = p.cliente_id, mostrar nombre y total, y ordenar por el id del pedido."
hints:
  - "Parte de la tabla pedidos y une la tabla clientes con JOIN."
  - "La condición de unión es que el id del cliente sea igual al cliente_id del pedido."
  - "Como ambas tablas tienen id, ordena con ORDER BY p.id para indicar de cuál hablas."
