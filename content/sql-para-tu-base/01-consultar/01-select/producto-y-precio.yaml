id: sql-select-001
type: sql
statement: "La tabla ventas tiene las columnas id, producto, categoria, cantidad y precio. Muestra el producto y el precio, y llama precio_unitario a la columna precio."
starter_code: "SELECT * FROM ventas;"
setup_sql: |
  CREATE TABLE ventas (id INTEGER, producto VARCHAR, categoria VARCHAR, cantidad INTEGER, precio DOUBLE);
  INSERT INTO ventas VALUES
    (1, 'Laptop', 'Cómputo', 2, 3200.0),
    (2, 'Mouse', 'Accesorios', 10, 45.5),
    (3, 'Teclado', 'Accesorios', 5, 120.0),
    (4, 'Monitor', 'Cómputo', 3, 850.0),
    (5, 'Cable HDMI', 'Accesorios', 8, 15.0),
    (6, 'Silla', 'Muebles', 1, 400.0);
expected:
  columns: [producto, precio_unitario]
  rows:
    - [Laptop, 3200]
    - [Mouse, 45.5]
    - [Teclado, 120]
    - [Monitor, 850]
    - [Cable HDMI, 15]
    - [Silla, 400]
solution: |
  SELECT producto, precio AS precio_unitario
  FROM ventas;
rubric: "El alumno debe seleccionar solo las columnas producto y precio, y renombrar precio como precio_unitario con AS."
hints:
  - "En lugar de * escribe los nombres de las dos columnas, separados por coma."
  - "AS va justo después de la columna que quieres renombrar."
  - "La forma es: SELECT producto, precio AS nombre_nuevo FROM ventas;"
