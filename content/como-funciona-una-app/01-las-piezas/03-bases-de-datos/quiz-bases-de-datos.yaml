id: fundamentos-app-003
type: quiz
statement: "¿Para qué sirve una base de datos en una aplicación?"
options:
  - "Para dibujar la interfaz"
  - "Para guardar datos de forma permanente y poder consultarlos después"
  - "Para ejecutar el código del frontend"
  - "Para enviar correos electrónicos"
correct: 1
explanation: "La base de datos conserva la información (usuarios, progreso, contenido) aunque el programa se apague, y permite consultarla con lenguajes como SQL."
